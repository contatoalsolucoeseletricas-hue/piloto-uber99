name: Build Piloto Uber99 Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Release Keystore
        env:
          KS_PASS: "PilotoUber99Release2026!"
          KEY_ALIAS: "piloto_release"
        run: |
          keytool -genkeypair -v \
            -keystore app/release.jks \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -dname "CN=AL Solucoes Piloto Uber99, OU=Mobile, O=AL Solucoes, L=Canoas, ST=RS, C=BR"

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Signed Release APK
        env:
          RELEASE_STORE_FILE: "release.jks"
          RELEASE_STORE_PASSWORD: "PilotoUber99Release2026!"
          RELEASE_KEY_ALIAS: "piloto_release"
          RELEASE_KEY_PASSWORD: "PilotoUber99Release2026!"
        run: gradle assembleRelease --no-daemon

      - name: Verify APK Signature and Output
        run: |
          ls -lh app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk app-release-v1.4-assinado.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: piloto-uber99-release-v1.4-apk
          path: app-release-v1.4-assinado.apk
